<script>
    (function () {
        var open = function () { return document.querySelectorAll(".menu-submenu details[open]"); };
        document.addEventListener("click", function (e) {
            open().forEach(function (d) { if (!d.contains(e.target)) d.open = false; });
        });
        document.addEventListener("keydown", function (e) {
            if (e.key !== "Escape") return;
            open().forEach(function (d) { d.open = false; d.querySelector("summary").focus(); });
        });
    })();
</script>
