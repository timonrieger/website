name: Daily Site Publication

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.PAT }}

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Run reading script
        run: mise run reading
        env:
          READWISE_KEY: ${{ secrets.READWISE_KEY }}

      - name: Lint changes
        run: mise run lint:fix

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: Published on ${{ steps.date.outputs.date }}
          file_pattern: 'content/reading.md'
